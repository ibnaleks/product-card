<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <title>Продуктовая корзина</title>
</head>

<body>
  <div class="page">
    <div class="top-buttom-wrapper">
      <div>
        <button class="top-buttom recolor-first-card-buttom">Поменять цвет первой карточки</button>
        <button class="top-buttom recolor-cards-buttom">Поменять цвет всех карточек</button>
        <button class="top-buttom open-google-buttom">Перейти на сайт google.com</button>
        <button class="top-buttom self-recolor-button-purple">Нажми, что бы поменять цвет
          кнопки!</button>
      </div>
    </div>
    <h1 class="page-title">Выбери свой продукт</h1>
    <div class="product-card-wrapper">

      <template id="product-card-template">
        <div class="product-card">
          <img class="product-card__image" src="" alt="">
          <p class="product-card__type"></p>
          <h2 class="product-card__title"></h2>
          <span class="product-card__description"></span>
          <div class="ingredients-block">
            <span class="ingredients-block__title">Состав:</span>
            <ul class="ingredients-block__list">
            </ul>
          </div>
          <div class="price-block">
            <span class="price-label">Цена</span>
            <span class="price-cost"></span>
          </div>
        </div>
      </template>

    </div>
  </div>
  <script src="script.js"></script>
  <script src="homework-5.js"></script>
  <script src="homework-6.js"></script>
  <script src="homework-7.js" type="module"></script>
  <script src="homework-8.js" type="module"></script>
</body>

</html>
